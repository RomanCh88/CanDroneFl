# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # Hard ceiling on scale-out to bound cost (weather + calculations run in the browser,
  # so the server only serves pages and auth/invite APIs). 3 × 80 concurrency ≈ 240
  # simultaneous requests. Raise if users start seeing 429/503 under real load.
  maxInstances: 3
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Firebase web config for sign-in. NEXT_PUBLIC_* are inlined at BUILD time, so BUILD is required.
  # These values are public by design (security = Auth + firestore.rules).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAo1k1LNbT3jVxRlAZLDufRikUHIDFfKsI"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "candronefly.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "candronefly"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "candronefly.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "228737059549"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:228737059549:web:882f219938334916822934"
    availability: [BUILD, RUNTIME]

  # Invite-only access — server-side only (RUNTIME, never sent to the browser).
  # Values live in Cloud Secret Manager (set with `firebase apphosting:secrets:set <name>`);
  # only the secret NAMES are in this file.
  - variable: ADMIN_EMAIL
    secret: adminEmail
    availability: [RUNTIME]
  - variable: APPROVAL_SECRET
    secret: approvalSecret
    availability: [RUNTIME]
  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability: [RUNTIME]
  - variable: EMAIL_FROM
    value: "DroneFly <noreply@candronefly.org>"
    availability: [RUNTIME]
  # APP_URL (optional): base URL for links in emails. Unset = the host the request came from,
  # which works for both the hosted.app address and a custom domain.
